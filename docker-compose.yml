services:
  db:
    image: postgres:16-alpine
    container_name: foodsafe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodsafe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-foodsafe_db}
    ports:
      - "5432:5432"
    volumes:
      - foodsafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodsafe} -d ${POSTGRES_DB:-foodsafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foodsafe_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodsafe_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodsafe}:${POSTGRES_PASSWORD:-foodsafe_secret}@db:5432/${POSTGRES_DB:-foodsafe_db}
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - foodsafe_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodsafe_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - foodsafe_net

volumes:
  foodsafe_pgdata:
    driver: local

networks:
  foodsafe_net:
    driver: bridge
